version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sql_plan_postgres
    restart: always
    environment:
      POSTGRES_DB: sqldb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sqldb"]
      interval: 5s
      timeout: 5s
      retries: 5
